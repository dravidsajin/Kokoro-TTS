<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" style="background:#090914;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a16"/>
      <stop offset="50%" stop-color="#0f0f24"/>
      <stop offset="100%" stop-color="#070710"/>
    </linearGradient>

    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="feGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(139, 92, 246, 0.15)"/>
      <stop offset="100%" stop-color="rgba(59, 130, 246, 0.05)"/>
    </linearGradient>

    <linearGradient id="beGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(6, 182, 212, 0.15)"/>
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.05)"/>
    </linearGradient>

    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(236, 72, 153, 0.15)"/>
      <stop offset="100%" stop-color="rgba(139, 92, 246, 0.08)"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#06b6d4"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a855f7"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="900" fill="url(#bgGrad)"/>

  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.06">
    <path d="M 0 150 L 1200 150 M 0 300 L 1200 300 M 0 450 L 1200 450 M 0 600 L 1200 600 M 0 750 L 1200 750" stroke="#fff" stroke-width="1"/>
    <path d="M 200 0 L 200 900 M 400 0 L 400 900 M 600 0 L 600 900 M 800 0 L 800 900 M 1000 0 L 1000 900" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- ========================================================================= -->
  <!-- HEADER SECTION                                                            -->
  <!-- ========================================================================= -->
  <g transform="translate(60, 45)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="rgba(6,182,212,0.15)" stroke="rgba(6,182,212,0.4)" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#06b6d4"/>
    <text x="24" y="16" fill="#67e8f9" font-size="10.5" font-weight="700" letter-spacing="1">SYSTEM SPECS</text>

    <!-- Main Title -->
    <text x="0" y="54" fill="#ffffff" font-size="28" font-weight="800" letter-spacing="-0.5">
      Vocalis AI Studio <tspan fill="url(#brandGrad)">Architecture</tspan>
    </text>
    <text x="0" y="78" fill="#94a3b8" font-size="13" font-weight="400">
      Production Full-Stack Architecture with Local Quantized ONNX Neural Synthesis &amp; SSE Streaming
    </text>

    <!-- Top Right Meta Pills -->
    <g transform="translate(820, 15)">
      <rect x="0" y="0" width="115" height="26" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
      <text x="12" y="17" fill="#cbd5e1" font-size="11" font-weight="600">⚡ Next.js 16 (Turbopack)</text>
      
      <rect x="125" y="0" width="135" height="26" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
      <text x="135" y="17" fill="#cbd5e1" font-size="11" font-weight="600">🧠 Kokoro-82M ONNX (Q8)</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- LAYER 1: CLIENT / FRONTEND (NEXT.JS 16)                                   -->
  <!-- ========================================================================= -->
  <g transform="translate(60, 150)">
    <!-- Main Group Container -->
    <rect width="1080" height="210" rx="16" fill="url(#feGrad)" stroke="rgba(139,92,246,0.3)" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Layer Header -->
    <g transform="translate(24, 22)">
      <rect x="0" y="0" width="30" height="30" rx="8" fill="#8b5cf6" opacity="0.2"/>
      <text x="9" y="20" fill="#c084fc" font-size="15">💻</text>
      <text x="38" y="16" fill="#f8fafc" font-size="15" font-weight="700">Client Layer (Frontend)</text>
      <text x="38" y="30" fill="#94a3b8" font-size="11">Next.js 16 App Router • React 19 • Vanilla CSS Design System • Port 3000</text>
    </g>

    <!-- Sub-component cards inside Frontend -->
    <!-- Card 1: Script Editor & Fluid Progress Ticker -->
    <g transform="translate(24, 66)">
      <rect width="325" height="120" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="16" y="24" fill="#a78bfa" font-size="12" font-weight="700">📝 TextInputArea &amp; Progress Ticker</text>
      <text x="16" y="44" fill="#cbd5e1" font-size="11">• Script textarea with max 5,000 char limiter</text>
      <text x="16" y="62" fill="#cbd5e1" font-size="11">• Quick Presets &amp; Speed slider (0.5x - 2.0x)</text>
      <text x="16" y="80" fill="#06b6d4" font-size="11" font-weight="600">• Smooth Progress Ticker (12% → 100%)</text>
      <text x="16" y="98" fill="#94a3b8" font-size="10.5">• Instant button disable (zero double-clicks)</text>
    </g>

    <!-- Card 2: Voice Catalog Explorer -->
    <g transform="translate(373, 66)">
      <rect width="330" height="120" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="16" y="24" fill="#38bdf8" font-size="12" font-weight="700">🎭 Voice Catalog Modal (28 Voices)</text>
      <text x="16" y="44" fill="#cbd5e1" font-size="11">• 🇺🇸 American &amp; 🇬🇧 British vocal accents</text>
      <text x="16" y="62" fill="#cbd5e1" font-size="11">• Quality Grades (A, B+) &amp; Gender tags</text>
      <text x="16" y="80" fill="#cbd5e1" font-size="11">• In-modal audio preview audio player</text>
      <text x="16" y="98" fill="#94a3b8" font-size="10.5">• Instant search by personality traits</text>
    </g>

    <!-- Card 3: Audio Station & Canvas Visualizer -->
    <g transform="translate(727, 66)">
      <rect width="329" height="120" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="16" y="24" fill="#34d399" font-size="12" font-weight="700">🌊 Audio Player &amp; Canvas Visualizer</text>
      <text x="16" y="44" fill="#cbd5e1" font-size="11">• Live Web Audio API frequency spectrum</text>
      <text x="16" y="62" fill="#cbd5e1" font-size="11">• Scrubbing timeline, volume, speed control</text>
      <text x="16" y="80" fill="#cbd5e1" font-size="11">• Direct Studio WAV audio downloader</text>
      <text x="16" y="98" fill="#94a3b8" font-size="10.5">• Generation History drawer (LocalStorage)</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- MIDDLE LAYER: NETWORK, SSE & PROTOCOL BRIDGE                              -->
  <!-- ========================================================================= -->
  <g transform="translate(60, 385)">
    <!-- Flow Connector Lines -->
    <!-- Line 1: Request (POST /api/tts/synthesize-stream) -->
    <path d="M 230 0 L 230 45" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowCyan)"/>
    <rect x="95" y="12" width="270" height="20" rx="4" fill="#090914" stroke="rgba(6,182,212,0.4)" stroke-width="1"/>
    <text x="105" y="26" fill="#67e8f9" font-size="10" font-weight="700">POST /api/tts/synthesize-stream (SSE)</text>

    <!-- Line 2: Real-time SSE Chunk Progress Events -->
    <path d="M 540 45 L 540 0" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowPurple)"/>
    <rect x="420" y="12" width="240" height="20" rx="4" fill="#090914" stroke="rgba(168,85,247,0.4)" stroke-width="1"/>
    <text x="430" y="26" fill="#c084fc" font-size="10" font-weight="700">SSE: data: { stage, chunk, percent }</text>

    <!-- Line 3: Final Payload (Base64 WAV + Cache Hit / Health) -->
    <path d="M 890 45 L 890 0" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <rect x="760" y="12" width="260" height="20" rx="4" fill="#090914" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
    <text x="770" y="26" fill="#6ee7b7" font-size="10" font-weight="700">Response: data: { audioBase64, wav }</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LAYER 2: BACKEND MICROSERVICE (NODE.JS + TYPESCRIPT)                      -->
  <!-- ========================================================================= -->
  <g transform="translate(60, 450)">
    <!-- Container -->
    <rect width="1080" height="210" rx="16" fill="url(#beGrad)" stroke="rgba(6,182,212,0.3)" stroke-width="1.5" filter="url(#shadow)"/>

    <!-- Layer Header -->
    <g transform="translate(24, 22)">
      <rect x="0" y="0" width="30" height="30" rx="8" fill="#06b6d4" opacity="0.2"/>
      <text x="9" y="20" fill="#22d3ee" font-size="15">⚙️</text>
      <text x="38" y="16" fill="#f8fafc" font-size="15" font-weight="700">Backend Service Layer</text>
      <text x="38" y="30" fill="#94a3b8" font-size="11">Node.js • Express • TypeScript • Zod Runtime Validation • Port 5001</text>
    </g>

    <!-- Sub-component cards inside Backend -->
    <!-- Card 1: Express REST API & SSE Router -->
    <g transform="translate(24, 66)">
      <rect width="325" height="120" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="16" y="24" fill="#06b6d4" font-size="12" font-weight="700">📡 Express &amp; SSE Stream Router</text>
      <text x="16" y="44" fill="#cbd5e1" font-size="11">• <tspan fill="#38bdf8">POST /api/tts/synthesize-stream</tspan></text>
      <text x="16" y="62" fill="#cbd5e1" font-size="11">• <tspan fill="#38bdf8">GET /api/voices</tspan> &amp; <tspan fill="#38bdf8">GET /api/health</tspan></text>
      <text x="16" y="80" fill="#cbd5e1" font-size="11">• Socket unbuffering (<tspan fill="#94a3b8">res.flushHeaders</tspan>)</text>
      <text x="16" y="98" fill="#94a3b8" font-size="10.5">• Zod payload validation with sanitization</text>
    </g>

    <!-- Card 2: SHA-256 LRU Cache -->
    <g transform="translate(373, 66)">
      <rect width="330" height="120" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="16" y="24" fill="#10b981" font-size="12" font-weight="700">⚡ SHA-256 LRU Audio Cache</text>
      <text x="16" y="44" fill="#cbd5e1" font-size="11">• Composite key: <tspan fill="#6ee7b7">hash(text + voice + speed)</tspan></text>
      <text x="16" y="62" fill="#cbd5e1" font-size="11">• Instant retrieval: <tspan fill="#6ee7b7">0-3ms response</tspan></text>
      <text x="16" y="80" fill="#cbd5e1" font-size="11">• Memory-safe LRU eviction threshold</text>
      <text x="16" y="98" fill="#94a3b8" font-size="10.5">• Bypasses neural inference on cache hit</text>
    </g>

    <!-- Card 3: Sentence Chunker & Audio Stitcher -->
    <g transform="translate(727, 66)">
      <rect width="329" height="120" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="16" y="24" fill="#fbbf24" font-size="12" font-weight="700">✂️ Sentence Chunker &amp; WAV Stitcher</text>
      <text x="16" y="44" fill="#cbd5e1" font-size="11">• Boundary-aware clause splitting (180 char)</text>
      <text x="16" y="62" fill="#cbd5e1" font-size="11">• Natural comma &amp; period pause preservation</text>
      <text x="16" y="80" fill="#cbd5e1" font-size="11">• Multi-chunk PCM float buffer concatenation</text>
      <text x="16" y="98" fill="#94a3b8" font-size="10.5">• 24,000 Hz, 16-bit mono WAV header builder</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- LAYER 3: AI NEURAL INFERENCE (KOKORO-82M ONNX)                            -->
  <!-- ========================================================================= -->
  <g transform="translate(60, 680)">
    <!-- Container -->
    <rect width="1080" height="170" rx="16" fill="url(#aiGrad)" stroke="rgba(236,72,153,0.3)" stroke-width="1.5" filter="url(#shadow)"/>

    <!-- Layer Header -->
    <g transform="translate(24, 20)">
      <rect x="0" y="0" width="30" height="30" rx="8" fill="#ec4899" opacity="0.2"/>
      <text x="9" y="20" fill="#f472b6" font-size="15">🧠</text>
      <text x="38" y="16" fill="#f8fafc" font-size="15" font-weight="700">AI Neural Engine Layer</text>
      <text x="38" y="30" fill="#94a3b8" font-size="11">Kokoro-82M ONNX • Hugging Face Transformers.js • In-Process Local Execution</text>
    </g>

    <!-- Sub-cards inside AI Layer -->
    <!-- Model Architecture Info -->
    <g transform="translate(24, 60)">
      <rect width="325" height="90" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="16" y="24" fill="#f472b6" font-size="12" font-weight="700">📦 Model Architecture</text>
      <text x="16" y="44" fill="#cbd5e1" font-size="11">• Kokoro-82M v1.0 ONNX Engine</text>
      <text x="16" y="62" fill="#cbd5e1" font-size="11">• 82 Million Parameter Weights</text>
      <text x="16" y="80" fill="#94a3b8" font-size="10.5">• High-fidelity human prosody &amp; tone</text>
    </g>

    <!-- Quantization & Compute -->
    <g transform="translate(373, 60)">
      <rect width="330" height="90" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="16" y="24" fill="#c084fc" font-size="12" font-weight="700">⚡ Q8 Quantization &amp; Execution</text>
      <text x="16" y="44" fill="#cbd5e1" font-size="11">• 8-bit quantized weights (~80MB footprint)</text>
      <text x="16" y="62" fill="#cbd5e1" font-size="11">• Pure CPU inference (no GPU required)</text>
      <text x="16" y="80" fill="#94a3b8" font-size="10.5">• Blazing warmup in &lt; 450 milliseconds</text>
    </g>

    <!-- Voice Vectors & Sample Rates -->
    <g transform="translate(727, 60)">
      <rect width="329" height="90" rx="10" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="16" y="24" fill="#38bdf8" font-size="12" font-weight="700">🎙️ Vocal Acoustic Output</text>
      <text x="16" y="44" fill="#cbd5e1" font-size="11">• 28 Speaker Embedding Vectors</text>
      <text x="16" y="62" fill="#cbd5e1" font-size="11">• 24,000 Hz Studio Sample Rate</text>
      <text x="16" y="80" fill="#94a3b8" font-size="10.5">• IEEE 32-bit Float Audio Tensors</text>
    </g>
  </g>

  <!-- Connective Arrows between Backend and AI -->
  <g transform="translate(60, 660)">
    <path d="M 186 0 L 186 20" stroke="#f472b6" stroke-width="1.8" marker-end="url(#arrowPurple)"/>
    <path d="M 538 0 L 538 20" stroke="#f472b6" stroke-width="1.8" marker-end="url(#arrowPurple)"/>
    <path d="M 890 20 L 890 0" stroke="#06b6d4" stroke-width="1.8" marker-end="url(#arrowCyan)"/>
  </g>

  <!-- ========================================================================= -->
  <!-- FOOTER ORCHESTRATION BANNER                                               -->
  <!-- ========================================================================= -->
  <g transform="translate(60, 862)">
    <text x="0" y="16" fill="#64748b" font-size="11" font-weight="500">
      🚀 Single Command Orchestration: <tspan fill="#38bdf8" font-family="monospace">./start.sh</tspan> launches concurrent Next.js frontend + Node.js backend with automated port management.
    </text>
    <text x="1080" y="16" text-anchor="end" fill="#64748b" font-size="11" font-weight="500">
      Vocalis AI Studio • Open-Source Architecture
    </text>
  </g>
</svg>
